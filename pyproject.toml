[project]
name = "dualloop"
version = "0.1.0"
description = "Arbitraje aprendido y auditable entre motores de decision heterogeneos (LLM + clasificadores tipados + reglas), con cierre del bucle decision-resultado-recalibracion sin reentrenamiento manual."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jorge Torres" }]
keywords = ["agentic-ai", "llm", "arbitration", "calibration", "bandits", "jev", "typesafe-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/JorgeTorresF/dualloop"
Issues = "https://github.com/JorgeTorresF/dualloop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dualloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

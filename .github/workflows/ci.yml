name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version that fails, not just the first one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Demo smoke test
        # The synthetic demo exercises the whole loop end to end -- cascade,
        # calibration, bandit, threshold and audit trail -- with a fixed
        # seed and no network. If it stops running, something real broke.
        run: python examples/demo_synthetic.py
